name: Independent portrait music Short
'on':
  workflow_call:
    inputs:
      source_run:
        required: true
        type: string
      parent_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run:
        description: GitHub run containing the long song lyrics artifact
        required: true
        type: string
      parent_run:
        description: Long song run identity
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: heart-and-mind-short-${{ inputs.parent_run }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARENT_RUN: ${{ inputs.parent_run }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - name: Restore reviewed parent song
      uses: actions/download-artifact@v4
      with:
        name: music-input-${{ inputs.source_run }}
        run-id: ${{ inputs.source_run }}
        github-token: ${{ github.token }}
        path: output/
    - name: Create hook-first companion lyrics and independent arrangement
      run: python -u music_short.py --parent-run "$PARENT_RUN" --stage plan
    - uses: actions/upload-artifact@v4
      with:
        name: short-input-${{ github.run_id }}
        path: output/*-short/song.json
        retention-days: 7
  music:
    needs:
    - plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '18000'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      PARENT_RUN: ${{ inputs.parent_run }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: ace-step/ACE-Step-1.5
        ref: ca1e85fe9430179831e6bc6be790c332190a3866
        path: .vendor/ace-step
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Prepare CPU runner memory and audio tools
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
        sudo fallocate -l 16G /swapfile-music
        sudo chmod 600 /swapfile-music
        sudo mkswap /swapfile-music
        sudo swapon /swapfile-music
        free -h
        df -h .
    - name: Install CPU-only music inference runtime
      run: |
        pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
    - name: Verify pinned ACE-Step CPU imports
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        from music_cpu import runtime
        torch, handler, params, config, infer = runtime(Path(os.environ['ACESTEP_SOURCE_DIR']))
        assert not torch.cuda.is_available()
        print('Pinned ACE-Step CPU runtime imported successfully')
        PY
    - uses: actions/download-artifact@v4
      with:
        name: short-input-${{ github.run_id }}
        path: output/
    - name: Synthesize new 45-second music, never cut the long audio
      run: python -u music_short.py --parent-run "$PARENT_RUN" --stage music
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: short-music-${{ github.run_id }}
        path: |-
          output/*-short/song.json
          output/*-short/song.wav
          output/*-short/generation-state.json
          output/*-short/music-video-timing.json
        retention-days: 7
        if-no-files-found: warn
  images:
    needs:
    - plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CPU_IMAGE_WIDTH: '576'
      CPU_IMAGE_HEIGHT: '1024'
      CPU_IMAGE_STEPS: '20'
      IMAGE_SHARD: ${{ matrix.shard }}
      IMAGE_SHARDS: '3'
      PARENT_RUN: ${{ inputs.parent_run }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Prepare CPU image memory
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo fallocate -l 12G /swapfile-images
        sudo chmod 600 /swapfile-images
        sudo mkswap /swapfile-images
        sudo swapon /swapfile-images
    - name: Install reference SSD-1B CPU image runtime
      run: |
        pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
    - uses: actions/download-artifact@v4
      with:
        name: short-input-${{ github.run_id }}
        path: output/
    - name: Generate fresh portrait images on three parallel workers
      run: python -u music_short.py --parent-run "$PARENT_RUN" --stage images
    - name: Package worker-owned portrait assets
      run: python music_short.py --parent-run "$PARENT_RUN" --stage package
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: short-artwork-${{ github.run_id }}-${{ matrix.shard }}
        path: artifacts/music-images/
        retention-days: 7
        if-no-files-found: warn
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
        - 0
        - 1
        - 2
  render:
    needs:
    - music
    - images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PARENT_RUN: ${{ inputs.parent_run }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: |-
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install -r requirements.txt
    - uses: actions/download-artifact@v4
      with:
        name: short-music-${{ github.run_id }}
        path: output/
    - uses: actions/download-artifact@v4
      with:
        pattern: short-artwork-${{ github.run_id }}-*
        merge-multiple: true
        path: output/
    - name: Render and verify 1080x1920 Short
      run: python -u music_short.py --parent-run "$PARENT_RUN" --stage render
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: short-rendered-${{ github.run_id }}
        path: |-
          output/*-short/song.json
          output/*-short/song.wav
          output/*-short/video.mp4
          output/*-short/thumbnail.jpg
          output/*-short/music-render-state.json
        retention-days: 7
        if-no-files-found: warn
  publish:
    needs:
    - render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      PARENT_RUN: ${{ inputs.parent_run }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: |-
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install -r requirements.txt
    - uses: actions/download-artifact@v4
      with:
        name: short-rendered-${{ github.run_id }}
        path: output/
    - name: Publish independent Short and verify public HD before cleanup
      run: python -u music_short.py --parent-run "$PARENT_RUN" --stage publish
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: short-publication-${{ github.run_id }}
        path: output/*-short/publication.json
        retention-days: 7
        if-no-files-found: warn
    if: vars.PUBLISH_ENABLED != 'false'
