name: Verify real Hindi reference episode (no publishing)
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Optional earlier Hindi preflight with saved lyrics/package draft
        type: string
        required: false
      saved_run_id:
        description: Saved episode identity when resuming source_run
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: hindi-language-preflight
  cancel-in-progress: false
jobs:
  hindi:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VIDEO_DURATION_SECONDS: '240'
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      RUN_ID: ${{ inputs.saved_run_id || format('hindi-check-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU writer and regression tools
        run: |
          bash scripts/install-runner-packages.sh ffmpeg
          python install_lyrics_dependencies.py
      - run: python -m unittest -v
      - uses: ./.github/actions/model-cache
        with:
          family: lyrics
      - name: Require explicit saved identity when resuming
        if: inputs.source_run != ''
        env:
          SAVED_RUN_ID: ${{ inputs.saved_run_id }}
        run: test -n "$SAVED_RUN_ID"
      - name: Restore accepted Hindi lyrics and metadata draft
        if: inputs.source_run != ''
        uses: actions/download-artifact@v4
        with:
          name: hindi-preflight-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Generate and validate a real Hindi episode and public package
        run: python -u hindi_preflight.py --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hindi-preflight-${{ github.run_id }}
          path: output/
          retention-days: 7
