name: Audit and clean verified published Drive media
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only media verified as published public HD by existing cleanup guards
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: heart-and-mind-drive-cleanup
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Audit or clean published media
        shell: bash
        run: |
          if [[ "$APPLY" == "true" ]]; then
            python -u tools/maintain_drive.py --apply
          else
            python -u tools/maintain_drive.py
          fi
