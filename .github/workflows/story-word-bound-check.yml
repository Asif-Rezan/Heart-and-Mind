name: Verify Hindi word limits with real Qwen CPU
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model-word-limits:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt -r requirements-lyrics.txt
    - name: Test adversarial word counts using the pinned production CPU model
      run: python -u verify_story_word_bounds.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: story-word-bound-regression
        path: output/story-word-bound-regression/
