name: One-minute AI background story sample
on:
  workflow_dispatch:
  push:
    branches: [codex/one-minute-background-sample]
    paths:
    - demo_background_story.py
    - .github/workflows/story-sample.yml
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng libsndfile1
        pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt -r requirements-voice-cpu.txt
    - run: python -u demo_background_story.py --stage voice
    - uses: actions/upload-artifact@v4
      with:
        name: sample-narration
        path: output/background-story-demo/
        if-no-files-found: error
        retention-days: 7
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      STORY_PART: ${{ matrix.part }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install the production SSD-1B CPU image runtime
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo fallocate -l 12G /swapfile-images
        sudo chmod 600 /swapfile-images
        sudo mkswap /swapfile-images
        sudo swapon /swapfile-images
        pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt -r requirements-images-cpu.txt
    - run: python -u demo_background_story.py --stage image --part "$STORY_PART"
    - uses: actions/upload-artifact@v4
      with:
        name: sample-image-${{ matrix.part }}
        path: output/background-story-demo/
        if-no-files-found: error
        retention-days: 7
  render:
    needs: [voice, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
        pip install -r requirements.txt 'soundfile>=0.13.1,<0.14'
    - uses: actions/download-artifact@v4
      with:
        pattern: sample-*
        merge-multiple: true
        path: output/background-story-demo/
    - run: python -u demo_background_story.py --stage render
    - uses: actions/upload-artifact@v4
      with:
        name: ai-background-story-sample-60s
        path: |
          output/background-story-demo/sample-video-60s.mp4
          output/background-story-demo/storyboard.jpg
          output/background-story-demo/verification.json
          output/background-story-demo/timing.json
          output/background-story-demo/script.txt
          output/background-story-demo/image-*.json
        if-no-files-found: error
        retention-days: 14
    - run: |
        echo '### One-minute AI background story sample' >> "$GITHUB_STEP_SUMMARY"
        echo 'Kokoro hm_omega, native rate, six fresh SSD-1B illustrations and camera motion. Exactly 60 seconds / 1500 frames, with a brief music-only ending; no speech truncation or time stretching. Download ai-background-story-sample-60s. No YouTube or Drive publication.' >> "$GITHUB_STEP_SUMMARY"
