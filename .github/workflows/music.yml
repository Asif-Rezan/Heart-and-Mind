name: Hindi music generation and public publishing
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Stable run ID; reuse it to resume an interrupted song
        required: true
        type: string
  schedule:
    - cron: '0 19 * * *' # 01:00 Asia/Dhaka
permissions:
  contents: read
concurrency:
  group: heart-and-mind-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ACESTEP_API_URL: ${{ secrets.ACESTEP_API_URL }}
      ACESTEP_API_KEY: ${{ secrets.ACESTEP_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      LYRICS_MODEL: ${{ vars.LYRICS_MODEL || 'llama-3.3-70b-versatile' }}
      REQUESTED_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Generate and publish
        shell: bash
        run: |
          RUN_ID="${REQUESTED_RUN_ID:-daily-$(TZ=Asia/Dhaka date +%F)}"
          python -u pipeline.py --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-output-${{ github.run_id }}
          path: output/*/*.json
          retention-days: 7
