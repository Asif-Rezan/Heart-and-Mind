name: Hindi music generation and public publishing
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Stable run ID; reuse it to resume an interrupted song
        required: true
        type: string
      prepared_run:
        description: Optional previous GitHub run ID whose saved song/video should be resumed
        required: false
        type: string
      retry_rejected_submission:
        description: Confirm logs show service rejection or a terminal GPU abort with no audio
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * *' # 01:00 Asia/Dhaka
permissions:
  contents: read
  actions: read
concurrency:
  group: heart-and-mind-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ACESTEP_API_URL: ${{ secrets.ACESTEP_API_URL }}
      ACESTEP_API_KEY: ${{ secrets.ACESTEP_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      LYRICS_MODEL: Qwen/Qwen3-4B-Instruct-2507
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      REQUESTED_RUN_ID: ${{ inputs.run_id }}
      RETRY_REJECTED_SUBMISSION: ${{ inputs.retry_rejected_submission }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt -r requirements-lyrics.txt
      - run: python -m unittest -v
      - name: Restore original generated music when resuming
        if: inputs.prepared_run != ''
        uses: actions/download-artifact@v4
        with:
          name: generated-music-${{ inputs.prepared_run }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Prepare original Hindi lyrics, music and video
        shell: bash
        run: |
          RUN_ID="${REQUESTED_RUN_ID:-daily-$(TZ=Asia/Dhaka date +%F)}"
          OPTIONS=()
          if [[ "$RETRY_REJECTED_SUBMISSION" == 'true' ]]; then
            OPTIONS+=(--retry-rejected-submission)
          fi
          python -u prepare_music.py --run-id "$RUN_ID" "${OPTIONS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-music-${{ github.run_id }}
          path: output/
          retention-days: 7
      - name: Generate and publish
        shell: bash
        run: |
          RUN_ID="${REQUESTED_RUN_ID:-daily-$(TZ=Asia/Dhaka date +%F)}"
          python -u pipeline.py --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-output-${{ github.run_id }}
          path: output/*/*.json
          retention-days: 7
