name: Heart and Mind original English songs
on:
  push:
    branches: [codex/english-songs]
    paths: [.generation/english-song-request.json]
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional stable english-song- identity; required for recovery
        type: string
      topic:
        description: Original emotional pop / soft-pop brief
        type: string
        default: Original emotional pop / soft-pop
      seconds:
        description: Target song duration; full measured performance is preserved
        type: choice
        options: ['180', '210', '240', '270', '300']
        default: '210'
      voice:
        description: Adult English singing voice
        type: choice
        options: [female, male]
        default: female
      publish:
        description: Requires ENGLISH_SONG_PUBLISH_ENABLED repository flag too
        type: boolean
        default: false
      backup_to_drive:
        description: Optional private backup during preview; no automatic preview cleanup
        type: boolean
        default: false
      operation:
        type: choice
        description: Generate, resume saved platform uploads, or retry verified cleanup
        options: [generate, recover, cleanup]
        default: generate
      prepared_run:
        description: Original numeric workflow run for artifact-based generation recovery
        type: string
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: heart-and-mind-english-songs
  cancel-in-progress: false
env:
  ENGLISH_SONG_PUBLISH_ENABLED: ${{ (inputs.publish || github.event_name == 'schedule') && vars.ENGLISH_SONG_PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
  ENGLISH_SONG_FACEBOOK_ENABLED: ${{ (inputs.publish || github.event_name == 'schedule') && vars.ENGLISH_SONG_PUBLISH_ENABLED == 'true' && vars.ENGLISH_SONG_FACEBOOK_ENABLED == 'true' && 'true' || 'false' }}
  ENGLISH_SONG_CLEANUP_ENABLED: ${{ (inputs.publish || github.event_name == 'schedule') && vars.ENGLISH_SONG_PUBLISH_ENABLED == 'true' && vars.ENGLISH_SONG_CLEANUP_ENABLED != 'false' && 'true' || 'false' }}
  ENGLISH_SONG_DRIVE_BACKUP: ${{ (inputs.backup_to_drive || ((inputs.publish || github.event_name == 'schedule') && vars.ENGLISH_SONG_PUBLISH_ENABLED == 'true')) && 'true' || 'false' }}
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  OMP_NUM_THREADS: '3'
  OPENBLAS_NUM_THREADS: '1'
  VIDEO_LANGUAGE: en
  AUDIO_LANGUAGE: en
  VIDEO_CATEGORY_ID: '10'
jobs:
  lyrics:
    name: Original English lyrics and independent editorial critique
    if: >-
      (github.event_name != 'schedule' || vars.ENGLISH_SONG_AUTOMATION_ENABLED != 'false') &&
      (inputs.operation == '' || inputs.operation == 'generate')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
    env:
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: identity
        env:
          REQUESTED: ${{ inputs.run_id }}
          PREPARED: ${{ inputs.prepared_run }}
        run: |
          run_id="${REQUESTED:-english-song-$GITHUB_RUN_ID}"
          [[ "$run_id" =~ ^english-song-[A-Za-z0-9_-]{1,60}$ ]]
          if [[ -n "$PREPARED" ]]; then [[ "$PREPARED" =~ ^[0-9]+$ && -n "$REQUESTED" ]]; fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - run: |
          bash scripts/install-runner-packages.sh ffmpeg
          python install_lyrics_dependencies.py
      - uses: actions/cache/restore@v4
        with:
          path: output/english-song-history.json
          key: english-song-history-v1-${{ github.run_id }}
          restore-keys: english-song-history-v1-
      - uses: ./.github/actions/model-cache
        with: {family: lyrics}
      - uses: actions/download-artifact@v4
        if: inputs.prepared_run != ''
        with:
          name: english-song-input-${{ inputs.prepared_run }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Write, critique, revise and reserve original English song
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          TOPIC: ${{ inputs.topic || 'Original emotional pop / soft-pop' }}
          SECONDS_REQUESTED: ${{ inputs.seconds || '210' }}
          VOICE: ${{ inputs.voice || 'female' }}
        run: python -u -m english_song --stage lyrics --run-id "$RUN_ID" --topic "$TOPIC" --seconds "$SECONDS_REQUESTED" --voice "$VOICE"
      - uses: actions/cache/save@v4
        if: always() && hashFiles('output/english-song-history.json') != ''
        with:
          path: output/english-song-history.json
          key: english-song-history-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'english-song-input-${{ github.run_id }}', path: output/, retention-days: 14}
  image_models:
    name: Prepare pinned image-model cache
    if: >-
      (github.event_name != 'schedule' || vars.ENGLISH_SONG_AUTOMATION_ENABLED != 'false') &&
      (inputs.operation == '' || inputs.operation == 'generate')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/model-cache
        with: {family: images}
  music:
    name: ACE-Step original English singing and full-song mastering
    needs: lyrics
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ENGLISH_SONG_PUBLISH_ENABLED: 'false'
      ENGLISH_SONG_DRIVE_BACKUP: 'false'
      REFERENCE_AUDIO_PATH: ''
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '18000'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: ace-step/ACE-Step-1.5
          ref: ca1e85fe9430179831e6bc6be790c332190a3866
          path: .vendor/ace-step
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare isolated CPU runner for singing inference
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          bash scripts/install-runner-packages.sh ffmpeg libsndfile1
          sudo fallocate -l 16G /swapfile-english-song
          sudo chmod 600 /swapfile-english-song
          sudo mkswap /swapfile-english-song
          sudo swapon /swapfile-english-song
          pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
      - uses: actions/download-artifact@v4
        with: {name: 'english-song-input-${{ github.run_id }}', path: output/}
      - uses: actions/download-artifact@v4
        if: inputs.prepared_run != ''
        with:
          name: english-song-music-${{ inputs.prepared_run }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - env: {RUN_ID: '${{ needs.lyrics.outputs.run_id }}'}
        run: python -u -m english_song --stage music --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'english-song-music-${{ github.run_id }}', path: output/, retention-days: 14}
  images:
    name: Cinematic lyric-related artwork ${{ matrix.index }}
    needs: [lyrics, image_models]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {index: [0, 1, 2, 3, 4, 5]}
    env:
      ENGLISH_SONG_PUBLISH_ENABLED: 'false'
      ENGLISH_SONG_DRIVE_BACKUP: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
      - uses: ./.github/actions/model-cache
        with: {family: images}
      - uses: actions/download-artifact@v4
        with: {name: 'english-song-input-${{ github.run_id }}', path: output/}
      - uses: actions/download-artifact@v4
        if: inputs.prepared_run != ''
        with:
          name: english-song-image-${{ inputs.prepared_run }}-${{ matrix.index }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - env: {RUN_ID: '${{ needs.lyrics.outputs.run_id }}', IMAGE_INDEX: '${{ matrix.index }}'}
        run: python -u -m english_song --stage image --run-id "$RUN_ID" --index "$IMAGE_INDEX"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'english-song-image-${{ github.run_id }}-${{ matrix.index }}', path: output/, retention-days: 14}
  render:
    name: MoviePy cinematic landscape music video and optional private backup
    needs: [lyrics, music, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          bash scripts/install-runner-packages.sh ffmpeg
          pip install -r requirements.txt -r requirements-song-video.txt
      - uses: actions/download-artifact@v4
        with: {name: 'english-song-music-${{ github.run_id }}', path: output/}
      - uses: actions/download-artifact@v4
        with: {pattern: 'english-song-image-${{ github.run_id }}-*', merge-multiple: true, path: output/}
      - name: Compose and decode complete 1080p video with MoviePy
        env:
          RUN_ID: ${{ needs.lyrics.outputs.run_id }}
          ENGLISH_SONG_PUBLISH_ENABLED: 'false'
          ENGLISH_SONG_DRIVE_BACKUP: 'false'
        run: python -u -m english_song --stage assemble --run-id "$RUN_ID"
      - name: Explicit optional private Drive backup
        if: env.ENGLISH_SONG_DRIVE_BACKUP == 'true'
        env: {RUN_ID: '${{ needs.lyrics.outputs.run_id }}'}
        run: python -u -m english_song --stage backup --run-id "$RUN_ID"
      - name: Save standalone video for quick preview downloads
        uses: actions/upload-artifact@v4
        with:
          name: english-song-video-${{ github.run_id }}
          path: output/*/video.mp4
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-song-finished-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/song.wav
            output/*/raw-song.wav
            output/*/thumbnail.jpg
            output/*/song.json
            output/*/metadata.json
            output/*/media.json
            output/*/music.json
            output/*/images/
          retention-days: 14
          if-no-files-found: error
      - run: |
          {
            echo '## Original English emotional soft-pop song'
            echo 'Qwen lyrics and critique; ACE-Step English singing/music; cinematic diffusion backgrounds; MoviePy 1080p landscape.'
            echo "Publishing: $ENGLISH_SONG_PUBLISH_ENABLED; Facebook: $ENGLISH_SONG_FACEBOOK_ENABLED; cleanup: $ENGLISH_SONG_CLEANUP_ENABLED."
            echo 'Preview artifacts require listening/viewing review; AI editorial scores do not verify the unheard performance.'
          } >> "$GITHUB_STEP_SUMMARY"
  publication:
    name: Guarded YouTube/Facebook publication
    needs: [lyrics, render]
    if: >-
      (inputs.publish || github.event_name == 'schedule') && vars.ENGLISH_SONG_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          bash scripts/install-runner-packages.sh ffmpeg
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: 'english-song-finished-${{ github.run_id }}', path: output/}
      - env: {RUN_ID: '${{ needs.lyrics.outputs.run_id }}'}
        run: |
          python -u -m english_song --stage publish --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'english-song-publication-${{ github.run_id }}', path: 'output/*/publication.json', retention-days: 14}
  drive_cleanup:
    name: Verify published platforms and clean Drive media
    needs: [lyrics, publication]
    if: >-
      needs.publication.result == 'success' && vars.ENGLISH_SONG_CLEANUP_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Restore receipts without downloading large media
        env: {RUN_ID: '${{ needs.lyrics.outputs.run_id }}'}
        run: python -u -m english_song --stage restore --metadata-only --run-id "$RUN_ID"
      - name: Verify public uploads and delete only exact backed-up files
        env: {RUN_ID: '${{ needs.lyrics.outputs.run_id }}'}
        run: python -u -m english_song --stage cleanup --run-id "$RUN_ID"
      - name: Save cleanup audit even after partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-song-cleanup-${{ github.run_id }}
          path: |
            output/*/publication.json
            output/*/cleanup-report.json
            output/*/failure.json
          retention-days: 14
          if-no-files-found: warn
  recovery:
    name: Recover original English publication or cleanup without regeneration
    if: inputs.operation == 'recover' || inputs.operation == 'cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          bash scripts/install-runner-packages.sh ffmpeg
          pip install -r requirements.txt
      - env: {RUN_ID: '${{ inputs.run_id }}', OPERATION: '${{ inputs.operation }}'}
        run: |
          test "$ENGLISH_SONG_PUBLISH_ENABLED" = true
          if [[ "$OPERATION" == cleanup ]]; then
            python -u -m english_song --stage restore --metadata-only --run-id "$RUN_ID"
          else
            python -u -m english_song --stage restore --run-id "$RUN_ID"
            python -u -m english_song --stage publish --run-id "$RUN_ID"
          fi
          python -u -m english_song --stage cleanup --run-id "$RUN_ID"
