name: Heart and Mind English family cartoon
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Unique cartoon identity; reuse only with its saved checkpoint
        required: true
        type: string
      topic:
        description: Shared family story theme
        default: A funny everyday misunderstanding resolved through cooperation
        type: string
      prepared_run:
        description: Optional previous cartoon workflow run with saved speech and story
        type: string
      upload_mode:
        description: Publication visibility after processing
        type: choice
        default: public
        options: [public, scheduled]
      publish_at:
        description: Optional ISO schedule override; empty preserves the existing schedule policy
        type: string
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: heart-and-mind-family-cartoon
  cancel-in-progress: false
env:
  VIDEO_LANGUAGE: en
  AUDIO_LANGUAGE: en
  VIDEO_CATEGORY_ID: '1'
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  story:
    name: Write English story and synthesize Kokoro voices
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
    env:
      REQUESTED_RUN_ID: ${{ inputs.run_id }}
      TOPIC: ${{ inputs.topic || 'A funny everyday misunderstanding resolved through cooperation' }}
      LYRICS_MODEL: Qwen/Qwen3-4B-Instruct-2507
      OMP_NUM_THREADS: '3'
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          RUN_ID="${REQUESTED_RUN_ID:-cartoon-$(TZ=Asia/Dhaka date +%F)}"
          [[ "$RUN_ID" =~ ^[a-zA-Z0-9_-]{1,80}$ ]] || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Validate existing publication configuration
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          FACEBOOK_PUBLISH_ENABLED: ${{ vars.FACEBOOK_PUBLISH_ENABLED }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
        run: python validate_publication_config.py
      - name: Install CPU story and speech runtime
        run: |
          bash scripts/install-runner-packages.sh ffmpeg espeak-ng libsndfile1
          pip install --no-cache-dir --retries 3 --timeout 45 -r requirements.txt
          python install_lyrics_dependencies.py
          pip install --no-cache-dir torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir --retries 3 --timeout 45 -r requirements-cartoon.txt
      - uses: ./.github/actions/model-cache
        with:
          family: lyrics
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--hexgrad--Kokoro-82M
          key: ${{ runner.os }}-kokoro-f3ff3571791e39611d31c381e3a41a3af07b4987-cast-v1
      - name: Run media and story regression tests with FFmpeg installed
        run: python -m unittest -v
      - name: Restore previous cartoon checkpoint
        if: inputs.prepared_run != ''
        uses: actions/download-artifact@v4
        with:
          name: cartoon-input-${{ inputs.prepared_run }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Verify restored cartoon belongs to the requested identity
        if: inputs.prepared_run != ''
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: |
          test -f "output/$RUN_ID/cartoon-draft.json" || {
            echo 'Saved cartoon does not match run_id or contains no resumable story checkpoint.'
            exit 1
          }
      - name: Write original English story
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: python -u cartoon.py --run-id "$RUN_ID" --topic "$TOPIC" --stage story
      - name: Synthesize three Kokoro voices and mix original instrumental score
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: python -u cartoon.py --run-id "$RUN_ID" --stage speech
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoon-input-${{ github.run_id }}
          path: output/
          retention-days: 7
  scene_01:
    name: Cartoon scene 01
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 0
      prepared_run: ${{ inputs.prepared_run }}
  scene_02:
    name: Cartoon scene 02
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 1
      prepared_run: ${{ inputs.prepared_run }}
  scene_03:
    name: Cartoon scene 03
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 2
      prepared_run: ${{ inputs.prepared_run }}
  scene_04:
    name: Cartoon scene 04
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 3
      prepared_run: ${{ inputs.prepared_run }}
  scene_05:
    name: Cartoon scene 05
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 4
      prepared_run: ${{ inputs.prepared_run }}
  scene_06:
    name: Cartoon scene 06
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 5
      prepared_run: ${{ inputs.prepared_run }}
  scene_07:
    name: Cartoon scene 07
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 6
      prepared_run: ${{ inputs.prepared_run }}
  scene_08:
    name: Cartoon scene 08
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 7
      prepared_run: ${{ inputs.prepared_run }}
  scene_09:
    name: Cartoon scene 09
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 8
      prepared_run: ${{ inputs.prepared_run }}
  scene_10:
    name: Cartoon scene 10
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 9
      prepared_run: ${{ inputs.prepared_run }}
  scene_11:
    name: Cartoon scene 11
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 10
      prepared_run: ${{ inputs.prepared_run }}
  scene_12:
    name: Cartoon scene 12
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 11
      prepared_run: ${{ inputs.prepared_run }}
  scene_13:
    name: Cartoon scene 13
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 12
      prepared_run: ${{ inputs.prepared_run }}
  scene_14:
    name: Cartoon scene 14
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 13
      prepared_run: ${{ inputs.prepared_run }}
  scene_15:
    name: Cartoon scene 15
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 14
      prepared_run: ${{ inputs.prepared_run }}
  scene_16:
    name: Cartoon scene 16
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 15
      prepared_run: ${{ inputs.prepared_run }}
  scene_17:
    name: Cartoon scene 17
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 16
      prepared_run: ${{ inputs.prepared_run }}
  scene_18:
    name: Cartoon scene 18
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 17
      prepared_run: ${{ inputs.prepared_run }}
  scene_19:
    name: Cartoon scene 19
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 18
      prepared_run: ${{ inputs.prepared_run }}
  scene_20:
    name: Cartoon scene 20
    needs: story
    uses: ./.github/workflows/cartoon-scene.yml
    with:
      run_id: ${{ needs.story.outputs.run_id }}
      shard: 19
      prepared_run: ${{ inputs.prepared_run }}
  publish:
    name: Assemble cartoon and publish to YouTube
    needs: [story, scene_01, scene_02, scene_03, scene_04, scene_05, scene_06, scene_07, scene_08, scene_09, scene_10, scene_11, scene_12, scene_13, scene_14, scene_15, scene_16, scene_17, scene_18, scene_19, scene_20]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUN_ID: ${{ needs.story.outputs.run_id }}
      UPLOAD_MODE: ${{ inputs.upload_mode || 'public' }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          bash scripts/install-runner-packages.sh ffmpeg
          pip install --no-cache-dir --retries 3 --timeout 45 -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: cartoon-input-${{ github.run_id }}
          path: output/
      - uses: actions/download-artifact@v4
        with:
          pattern: cartoon-assets-${{ github.run_id }}-*
          merge-multiple: true
          path: output/
      - name: Assemble dialogue-timed cartoon and verify final duration
        run: python -u cartoon.py --run-id "$RUN_ID" --stage render
      - uses: actions/upload-artifact@v4
        with:
          name: kids-video-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/thumbnail.jpg
            output/*/song.json
          retention-days: 7
      - name: Back up and publish through verified Heart and Mind account
        if: vars.PUBLISH_ENABLED == 'true'
        run: python -u cartoon.py --run-id "$RUN_ID" --stage publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoon-publication-${{ github.run_id }}
          path: output/*/*.json
          retention-days: 7
  facebook:
    name: Publish cartoon to Facebook
    needs: [story, publish]
    if: vars.FACEBOOK_PUBLISH_ENABLED == 'true' && vars.PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/facebook.yml
    with:
      source_run: ${{ format('{0}', github.run_id) }}
      run_id: ${{ needs.story.outputs.run_id }}
      kind: video
      non_blocking: false
    secrets: inherit

  cleanup:
    name: Clean published media from Drive
    needs: [story, publish]
    if: ${{ always() && !cancelled() && needs.publish.result == 'success' && vars.PUBLISH_ENABLED == 'true' }}
    # Cleanup shares a lock only with other cleanup sweeps.
    concurrency:
      group: dudi-drive-cleanup
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONG_RUN_ID: ${{ needs.story.outputs.run_id }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Clean eligible public HD episodes and record pending schedules
        run: python -u cleanup_drive.py --sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-cleanup-${{ github.run_id }}
          path: output/drive-cleanup-report.json
          retention-days: 14
