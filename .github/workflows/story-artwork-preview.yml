name: Story-grounded artwork review
on:
  push:
    branches: [codex/story-grounded-artwork]
  workflow_dispatch:
    inputs:
      source_run:
        description: Optional completed story run; blank uses the saved production-story regression
        type: string
        required: false
      scene_index:
        description: Narrated scene to preview as a video background
        type: number
        default: 0
permissions:
  contents: read
  actions: read
env:
  CUDA_VISIBLE_DEVICES: ''
  OMP_NUM_THREADS: '4'
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  review_regression:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip story preview]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
      - name: Reject the actual missing-letter portrait from the previous preview
        run: python -u preview_story_artwork.py --stage audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-regression
          path: output/story-artwork-preview/
          if-no-files-found: error
  plan:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip story preview]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kind: [background, thumbnail]
    env:
      IMAGE_KIND: ${{ matrix.kind }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SCENE_INDEX: ${{ inputs.scene_index || 0 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt -r requirements-lyrics.txt
      - name: Validate requested completed story identity
        if: inputs.source_run != ''
        run: '[[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        if: inputs.source_run != ''
        with:
          name: story-input-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: output/source/
      - name: Plan from final narration with exact evidence and visible-event checks
        run: |
          STORY_SOURCE=tests/fixtures/production-artwork-story.json
          if [ -n "$SOURCE_RUN" ]; then STORY_SOURCE=output/source; fi
          python -u preview_story_artwork.py --stage plan --kind "$IMAGE_KIND" --scene-index "$SCENE_INDEX" --story "$STORY_SOURCE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-artwork-plan-${{ matrix.kind }}
          path: output/story-artwork-preview/
          if-no-files-found: error
  generate:
    needs: [review_regression, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        kind: [background, thumbnail]
    env:
      IMAGE_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Prepare CPU image memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 12G /swapfile-images
          sudo chmod 600 /swapfile-images
          sudo mkswap /swapfile-images
          sudo swapon /swapfile-images
      - run: |
          pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: story-artwork-plan-${{ matrix.kind }}
          path: output/story-artwork-preview/
      - name: Generate and reject candidates missing the actual story event
        run: python -u preview_story_artwork.py --stage generate --kind "$IMAGE_KIND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-story-${{ matrix.kind }}
          path: output/story-artwork-preview/
          if-no-files-found: error
          retention-days: 7
