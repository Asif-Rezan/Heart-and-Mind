name: One-minute procedural soap ASMR preview
on:
  push:
    branches: [codex/asmr-cutting-preview-20261125]
    paths:
      - previews/asmr-cutting/**
      - .github/workflows/asmr-cutting-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asmr-cutting-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: Render 60-second procedural soap ASMR without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU rendering and sound tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r previews/asmr-cutting/requirements.txt
      - name: Verify cutting contact, detachment, landing and deterministic geometry
        run: python -m unittest discover -s previews/asmr-cutting -p test_soap_cutting.py -v
      - name: Render geometric blade and slices with synchronized synthesized sound
        run: python -u previews/asmr-cutting/soap_cutting.py
      - name: Save video, sound and media validation for review
        uses: actions/upload-artifact@v4
        with:
          name: soap-cutting-asmr-preview-60s-${{ github.run_number }}
          path: |
            previews/asmr-cutting/output/soap-cutting-asmr-preview.mp4
            previews/asmr-cutting/output/soap-cutting-sound-design.wav
            previews/asmr-cutting/output/soap-media-probe.json
          if-no-files-found: error
          retention-days: 14
      - name: Record preview-only completion
        run: |
          {
            echo '## ASMR preview ready'
            echo '60 seconds · 720×1280 portrait · 30 FPS · stereo event-synchronized soap-cutting sound.'
            echo 'Pillow-generated low-poly geometry adapted from the supplied make_asmr.py: moving blade, detachable slices, rotation, landing shadows and ballistic crumbs. Six ten-second color variations, thirty cuts; no AI still-image morphing.'
            echo 'Preview artifact only. No YouTube/Facebook/Drive upload, no secrets and no changes to main.'
          } >> "$GITHUB_STEP_SUMMARY"
