name: One-minute cutting ASMR preview
on:
  push:
    branches: [codex/asmr-cutting-preview-20261125]
    paths:
      - previews/asmr-cutting/**
      - .github/workflows/asmr-cutting-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asmr-cutting-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    name: Render 60-second ASMR preview without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU rendering and sound tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r previews/asmr-cutting/requirements.txt
      - name: Verify the five supplied AI-generated keyframes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('previews/asmr-cutting/images')
          images = sorted(root.glob('keyframe-*.png'))
          assert len(images) == 5
          for image in images:
              with Image.open(image) as frame:
                  frame.verify()
          print('Five consistent AI keyframes ready; no live image API call or credentials needed.')
          PY
      - name: Animate cuts and grains, synthesize stereo ASMR and encode MP4
        run: python -u previews/asmr-cutting/render_preview.py
      - name: Save video, sound and media validation for review
        uses: actions/upload-artifact@v4
        with:
          name: cutting-asmr-preview-60s-${{ github.run_number }}
          path: |
            previews/asmr-cutting/output/kinetic-sand-cutting-asmr-preview.mp4
            previews/asmr-cutting/output/cutting-sound-design.wav
            previews/asmr-cutting/output/media-probe.json
          if-no-files-found: error
          retention-days: 14
      - name: Record preview-only completion
        run: |
          echo '## ASMR preview ready' >> "$GITHUB_STEP_SUMMARY"
          echo '60 seconds · 1280×720 · 24 FPS · stereo synthesized cutting/crunching sound.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Five AI-generated keyframes, optical-flow interpolation, masking, localized deformation, particles and camera motion. Three 20-second passes reuse the five keyframes; this is stylized image animation, not a physical cutting simulation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview artifact only. No YouTube/Facebook/Drive upload, no secrets and no changes to main.' >> "$GITHUB_STEP_SUMMARY"
