name: Render one cartoon scene
on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      shard:
        required: true
        type: number
      prepared_run:
        required: false
        type: string
permissions:
  contents: read
  actions: read
env:
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  render:
    name: Generate illustration and animate scene
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUN_ID: ${{ inputs.run_id }}
      IMAGE_SHARD: ${{ inputs.shard }}
      IMAGE_SHARDS: '20'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU illustration and motion runtime
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          bash scripts/install-runner-packages.sh ffmpeg
          pip install --no-cache-dir torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir --retries 3 --timeout 45 -r requirements.txt -r requirements-images-cpu.txt -r requirements-motion-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: cartoon-input-${{ github.run_id }}
          path: output/
      - uses: ./.github/actions/model-cache
        with:
          family: images
      - uses: ./.github/actions/model-cache
        with:
          family: motion
      - name: Find saved cartoon shard
        id: recovery
        if: inputs.prepared_run != ''
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.prepared_run }}
          SHARD: ${{ inputs.shard }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.SOURCE_RUN)) throw new Error('prepared_run must be numeric');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: Number(process.env.SOURCE_RUN), per_page: 100
            });
            const name = `cartoon-assets-${process.env.SOURCE_RUN}-${process.env.SHARD}`;
            core.setOutput('available', artifacts.some(a => a.name === name && !a.expired));
      - name: Restore saved stage assets when resuming
        if: inputs.prepared_run != '' && steps.recovery.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cartoon-assets-${{ inputs.prepared_run }}-${{ inputs.shard }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Generate scene illustrations and voice-timed acting
        run: python -u cartoon.py --run-id "$RUN_ID" --stage images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoon-assets-${{ github.run_id }}-${{ inputs.shard }}
          path: |
            output/*/scene-*-source.*
            output/*/thumbnail-source.png
            output/*/characters/**
            output/*/cartoon-motion/**
            output/*/cartoon-failure.json
          retention-days: 7
